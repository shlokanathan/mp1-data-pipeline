validation:
  required_columns:
    - id
    - name
    - category
    - rating
    - price
  numeric_columns:
    - rating

processing:
  remove_duplicates: true

  missing:
    enabled: true
    axis: "rows"

  outliers:
    enabled: true
    columns:
      - rating
    method: "iqr"
    threshold: 1.5
